[package]
name = "macrolite"
version = "0.1.0"
edition = "2021"
description = "A minimal desktop mouse and keyboard macro recorder"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rdev = "0.5"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
